name: face_collect_native
description: "A plugin for liveness face recognition and capture"
version: 2.1.0
homepage: https://github.com/LiangLuDev/face_collect_native.git

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  google_mlkit_face_detection: ">=0.12.0 <0.16.0"
  camera: ^0.11.0+2
  image: ^4.0.17
  lottie: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# The following section is specific to Flutter packages.
flutter:
  assets:
    - packages/face_collect_native/assets/scan.json
